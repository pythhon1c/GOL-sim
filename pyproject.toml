[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gol-sim"
version = "0.1.0"
authors = [{name = "pythhon1c", email = "ggggggdev@gmail.com"}]
description = "Large-field exact Conway Life with a Rust calculation core"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "psutil>=6,<8"]

[project.scripts]
gol-sim = "life.__main__:main"
exact-life = "life.__main__:main"

[tool.setuptools.packages.find]
include = ["life*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
