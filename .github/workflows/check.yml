name: Correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and build native engine
        shell: pwsh
        run: ./setup.ps1
      - name: Verify native, API and frontend behavior
        shell: pwsh
        run: ./check.ps1
      - name: Audit publishable source
        shell: pwsh
        run: ./.venv/Scripts/python.exe tools/prepare_publication.py --check
